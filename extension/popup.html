<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeepBox to MakeCode Converter</title>
    <link href="nes.min.css" rel="stylesheet" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Tiny5&display=swap');

      body {
        width: 450px;
        padding: 1rem;
        font-family: 'Tiny5', sans-serif;
        margin: 0;
        background-color: #212529; /* Dark background to match NES dark theme */
      }

      h1 {
        font-family: 'Pixelify Sans', sans-serif;
        font-size: 1.2rem;
        margin: 0 0 1rem 0;
        text-align: center;
        color: #fff;
      }

      .status {
        margin-bottom: 1rem;
        font-size: 0.8rem;
      }

      .status.info {
        color: #fff;
      }

      .status.success {
        color: #92cc41;
      }

      .status.error {
        color: #e76e55;
      }

      .status.warning {
        color: #f7d51d;
      }

      .drop-zone {
        margin-top: 1rem;
        padding: 1.5rem;
        text-align: center;
        background-color: #212529;
      }

      .drop-zone.drag-over {
        background-color: #3e4349;
        border-color: #fff;
      }

      .drop-zone-text {
        color: #fff;
        font-size: 0.9rem;
        margin-bottom: 1rem;
      }

      .drop-zone-icon {
        font-size: 2rem;
        margin-bottom: 0.5rem;
      }

      input[type='file'] {
        display: none;
      }

      .input-group {
        margin-bottom: 1rem;
      }

      .nes-container {
        padding: 1rem !important;
      }

      .nes-field {
        margin-bottom: 1rem;
      }

      .footer-note {
        text-align: center;
        color: #666;
        margin-top: 1rem;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="nes-container is-dark with-title">
      <p class="title">Make Beep</p>

      <div id="status" style="text-align: center; padding: 0.5rem">
        <p style="margin: 0">
          Open this extension while on arcade.makecode.com
        </p>
      </div>

      <div class="nes-field is-dark">
        <label for="songName">Song Name:</label>
        <input
          type="text"
          id="songName"
          class="nes-input is-dark"
          placeholder="mySong"
          value="convertedSong"
        />
      </div>

      <div id="dropZone" class="nes-container is-dark is-rounded drop-zone">
        <div class="drop-zone-content">
          <p class="drop-zone-text">Drag & drop your BeepBox JSON file here</p>
          <p style="margin: 0.5rem 0; font-size: 0.8rem">or</p>
          <button class="nes-btn is-primary">Select File</button>
        </div>
      </div>

      <input type="file" id="fileInput" accept=".json,application/json" />

      <div class="footer-note">
        <a
          href="https://www.beepbox.co/#9n90sbk0l00e02t1Ua7g02j07r1i0o533333333T1v1u40f0qww10r51d08A4F2B6Q0068Pf624E2b676T1v1ub7f0q0w10p7d23A5F4B9Q0001Pffa7E4b862363379T1v1u19f0q802d23A5F4B0Q0202PeebbE0T5v1u85f10l7q00d23HK-LBJrttAAAyqhh0E0T1v1u18f0q00d23A0F0B0Q0000Pf600E1617T5v1ua0f60m92hc1ea2k02f30req83431d37H_QiBy9asq99900h0E0T5v1u85f10l7q00d23HK-LBJrttAAAyqhh0E0T1v1u56f0qww10p71d03A5F5B9Q0001PfaedE4b762663777T7v1u70f40p61770q72f5q0E21990l65d06HT-SRJJJJIAAAAAh0IaE1c11b4z4z4z4z4z4z4z4z4zp28kFEZFg410g410g410g410g410o10g410g410g410g410g41w410g410g40te2CzMQ10mg410g410g410g410o10g410g410g410g410g41w410g410g40te2CzMQ10mg410g410g410g410o10g410g410g410g410g41w410g410g40te2CzMQ10mg410g410g410g410o10g410g410g410g410g41w410g410g40te2CzMQ10mg410g410g410g410o10g410g410g410g410g41w410g410g40te2CzMQ10mg410g410g410g410o10g410g410g410g410g41w410g410g40te2CzMQ10mg410g410g410g410o10g410g410g410g410g41w410g410g40te2CzMQ10mg410g410g410g410o10g410g410g410g410g41w410g410g40te2CzMQ10mg410g410g410g410o10g410g410g410g410g41w410g410g40te0"
          class="nes-btn is-warning"
          target="_blank"
        >
          Download Starter BeepBox Project
        </a>
      </div>
    </div>

    <script src="converter.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
