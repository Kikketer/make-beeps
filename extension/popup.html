<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeepBox to MakeCode Converter</title>
  <style>
    body {
      width: 400px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
    }
    
    h1 {
      font-size: 18px;
      margin: 0 0 16px 0;
      color: #333;
    }
    
    .status {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 14px;
    }
    
    .status.info {
      background-color: #e3f2fd;
      color: #1565c0;
      border: 1px solid #90caf9;
    }
    
    .status.success {
      background-color: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #81c784;
    }
    
    .status.error {
      background-color: #ffebee;
      color: #c62828;
      border: 1px solid #ef5350;
    }
    
    .status.warning {
      background-color: #fff3e0;
      color: #e65100;
      border: 1px solid #ffb74d;
    }
    
    .drop-zone {
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background-color: #fafafa;
    }
    
    .drop-zone:hover {
      border-color: #2196f3;
      background-color: #f5f5f5;
    }
    
    .drop-zone.drag-over {
      border-color: #2196f3;
      background-color: #e3f2fd;
    }
    
    .drop-zone-text {
      color: #666;
      font-size: 14px;
      margin-bottom: 12px;
    }
    
    .drop-zone-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    
    .button {
      background-color: #2196f3;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.2s;
    }
    
    .button:hover {
      background-color: #1976d2;
    }
    
    .button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    
    input[type="file"] {
      display: none;
    }
    
    .song-name-input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      margin-bottom: 16px;
      box-sizing: border-box;
    }
    
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #555;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <h1>🎵 BeepBox to MakeCode Arcade</h1>
  
  <div id="status" class="status info">
    Open this extension while on arcade.makecode.com
  </div>
  
  <div>
    <label for="songName">Song Name:</label>
    <input 
      type="text" 
      id="songName" 
      class="song-name-input" 
      placeholder="mySong" 
      value="convertedSong"
    />
  </div>
  
  <div id="dropZone" class="drop-zone">
    <div class="drop-zone-icon">📁</div>
    <div class="drop-zone-text">
      Drag & drop your BeepBox JSON file here<br>
      or click to browse
    </div>
    <button class="button">Select File</button>
  </div>
  
  <input type="file" id="fileInput" accept=".json,application/json">
  
  <script src="converter.js"></script>
  <script src="popup.js"></script>
</body>
</html>
