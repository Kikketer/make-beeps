<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Converter</title>
    <link href="nes.min.css" rel="stylesheet" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Tiny5&display=swap');

      body {
        font-family: 'Tiny5', sans-serif;
        padding: 2rem;
        max-width: 800px;
        margin: 0 auto;
        background-color: #212529;
        color: #fff;
      }

      h1 {
        font-family: 'Pixelify Sans', sans-serif;
        color: #fff;
        text-align: center;
        margin-bottom: 2rem;
      }

      .test-result {
        margin-bottom: 1rem;
      }

      /* NES styling for results */
      .test-result.pass {
        color: #92cc41; /* NES green */
      }

      .test-result.fail {
        color: #e76e55; /* NES red */
      }

      pre {
        background-color: #000;
        color: #20c20e; /* Terminal green */
        padding: 1rem;
        border-radius: 4px;
        overflow-x: auto;
        font-family: monospace;
        border: 2px solid #fff;
      }
    </style>
  </head>
  <body>
    <h1>Converter Test</h1>

    <div class="nes-container is-dark with-title">
      <p class="title">Test Results</p>
      <div id="results"></div>
    </div>

    <script src="converter.js"></script>
    <script>
      const resultsDiv = document.getElementById('results')

      function addResult(name, passed, message) {
        const div = document.createElement('div')
        // Use NES container for each result or just text?
        // Let's use text inside the main container to save space
        div.className = `test-result ${passed ? 'pass' : 'fail'}`

        const icon = passed
          ? '<i class="nes-icon is-small heart"></i>'
          : '<i class="nes-icon is-small close"></i>'

        div.innerHTML = `<div class="nes-container is-dark is-rounded" style="border-color: ${passed ? '#92cc41' : '#e76e55'}">
        <p><strong>${icon} ${name}</strong></p>
        <p>${message}</p>
      </div>`
        resultsDiv.appendChild(div)
      }

      // Test 1: Basic conversion
      try {
        const testSong = {
          format: 'BeepBox',
          version: 9,
          scale: 'major',
          key: 'C',
          introBars: 0,
          loopBars: 1,
          beatsPerBar: 4,
          ticksPerBeat: 8,
          beatsPerMinute: 120,
          channels: [
            {
              type: 'pitch',
              instruments: [{}],
              patterns: [
                {
                  notes: [
                    {
                      pitches: [60],
                      points: [
                        { tick: 0, pitchBend: 0, volume: 3 },
                        { tick: 4, pitchBend: 0, volume: 3 },
                      ],
                    },
                  ],
                },
              ],
              sequence: [1],
              octaveScrollBar: 4,
            },
          ],
        }

        const hexOutput = convertBeepBoxToMakeCode(testSong)
        addResult(
          'Basic Conversion',
          hexOutput.length > 0,
          `Generated ${hexOutput.length} hex characters`,
        )

        // Test 2: Generate paste JSON
        const pasteData = generatePasteJSON(testSong, 'testSong')
        addResult(
          'Generate Paste JSON',
          pasteData.version === 1 && pasteData.data.paster === 'block',
          'Paste JSON structure is correct',
        )

        // Test 3: Check song data
        const songData = pasteData.data.blockState.fields.song.jres.testSong
        addResult(
          'Song Data',
          songData.data === hexOutput &&
            songData.mimeType === 'application/mkcd-song',
          'Song data matches hex output and has correct MIME type',
        )

        // Display sample output
        const container = document.createElement('div')
        container.innerHTML = '<h3 style="margin-top: 2rem;">Sample Output</h3>'

        const pre = document.createElement('pre')
        pre.textContent =
          'Sample Hex Output:\n' + hexOutput.substring(0, 100) + '...'
        container.appendChild(pre)

        const pre2 = document.createElement('pre')
        pre2.textContent =
          'Sample Paste JSON:\n' +
          JSON.stringify(pasteData, null, 2).substring(0, 500) +
          '...'
        container.appendChild(pre2)

        resultsDiv.appendChild(container)
      } catch (error) {
        addResult('Conversion Test', false, error.message)
        console.error(error)
      }
    </script>
  </body>
</html>
